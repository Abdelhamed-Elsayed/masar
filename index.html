<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7ff" />
    <meta name="description" content="Masar brings requests, approvals, and team updates together in one clear workflow." />
    <title>Masar — Workflow workspace</title>
    <script>
      (() => {
        try {
          const savedTheme = JSON.parse(localStorage.getItem('masar-theme') || 'null')
          if (savedTheme?.state?.theme === 'dark') document.documentElement.classList.add('dark')
        } catch {
          // Theme preference is optional; the app can still start with the light theme.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
